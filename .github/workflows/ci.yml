name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ ubuntu-24.04, macos-14 ]
        python-arch: [ 'x64' ]
        include:
          - runs-on: macos-14
            python-arch: 'arm64'
        exclude:
          - runs-on: macos-14
            python-arch: "x64"
    env:
      COVERAGE: true
    name: "${{ matrix.runs-on }} - Python 3.12 ${{ matrix.python-arch }}"
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        architecture: ${{ matrix.python-arch }}
    - name: Run pip
      run: python3 -m pip install -r python/test_requirements.txt
    - name: Run tests
      run: python3 run_tests.py --quiet python/ycm/tests
    - name: summarise coverage
      run: coverage xml
    - name: Upload coverage data
      uses: codecov/codecov-action@v4
      with:
        name: "${{ runner.os }}-3.12-${{ matrix.python-arch }}"
        token: ${{ secrets.CODECOV_TOKEN }}

  editor-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - editor: vim
            version: new
            arch: x86_64
            name: Vim tests - new
          - editor: vim
            version: old
            arch: x86_64
            name: Vim tests - old
          - editor: neovim
            version: stable
            arch: x86_64
            name: Neovim tests - stable
    runs-on: ubuntu-24.04
    container: 'youcompleteme/ycm-vim-${{ matrix.arch }}-py3:test'
    env:
      COVERAGE: true
      YCM_TEST_STDOUT: true
    name: "${{ matrix.name }}"
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Install Neovim
      if: matrix.editor == 'neovim'
      uses: rhysd/action-setup-vim@v1
      with:
        version: ${{ matrix.version }}
        neovim: true
    - name: Install dependencies
      run: sudo -H pip3 install --break-system-packages -r python/test_requirements.txt
    - name: Install Java
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'
    - name: Build ycmd
      run: python3 ./install.py --force-sudo --ts-completer --clangd-completer --java-completer
    - name: Run tests in old vim
      # System vim should be oldest supported.
      if: matrix.editor == 'vim' && matrix.version == 'old'
      run: ./test/run_vim_tests --vim /usr/bin/vim
    - name: Run tests in new vim
      if: matrix.editor == 'vim' && matrix.version == 'new'
      run: ./test/run_vim_tests
    - name: Run tests in Neovim
      if: matrix.editor == 'neovim'
      run: ./test/run_neovim_tests
    - name: Combine and summarise coverage
      run: coverage combine && coverage xml
    - name: Upload coverage data
      uses: codecov/codecov-action@v4
      with:
        name: "${{ matrix.editor }}-tests-${{ matrix.version }}"
        token: ${{ secrets.CODECOV_TOKEN }}
